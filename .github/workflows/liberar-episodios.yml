name: Liberar episódios no feed
# 6h, 9h, 12h, 15h, 18h e 21h (Brasília = UTC-3), com 2 min de folga
on:
  schedule:
    - cron: "2 9,12,15,18,21,0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  liberar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Atualizar feed e site
        run: python3 producao/scripts/gerar_site.py
      - name: Publicar se mudou
        run: |
          if git diff --quiet -- feed.xml index.html; then echo "nada novo"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml index.html
          git commit -m "Libera episódio agendado"
          git push
