<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;600;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;background:#000;overflow:hidden;font-family:Oswald,sans-serif;color:#eee}
#bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.25) brightness(.72)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.05) 30%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.85) 80%,#000 100%)}
svg.n{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.45}
.brand{position:absolute;top:140px;left:0;right:0;text-align:center;font-family:Anton;font-size:46px;letter-spacing:12px;color:#e8e2d6}
.brand small{display:block;font-family:Oswald;font-size:24px;letter-spacing:16px;color:#d4a53a;margin-top:4px}
.mid{position:absolute;top:1040px;left:60px;right:60px;text-align:left}
.kicker{display:inline-block;font-size:34px;letter-spacing:8px;color:#111;background:#d4a53a;font-weight:700;padding:4px 16px;margin-bottom:14px}
.big{font-family:Anton;line-height:1.08;padding-top:.08em;color:#f2ede4;text-shadow:0 6px 30px rgba(0,0,0,.8);letter-spacing:1px}
.cap{position:absolute;top:1420px;left:60px;right:150px}
.cap p{margin:0;font-size:50px;line-height:1.32;font-weight:600;color:#fff;text-shadow:0 3px 12px #000}
.cap .hl{color:#e9b94a}
.cred{position:absolute;bottom:60px;right:40px;font-size:20px;color:rgba(255,255,255,.5);font-family:Oswald}
.outro{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.55)}
.outro h1{font-family:Anton;font-size:190px;margin:0;color:#e8e2d6;letter-spacing:6px}
.outro .l{display:flex;align-items:center;gap:24px;color:#d4a53a;font-family:Anton;font-size:64px;letter-spacing:22px}
.outro .l:before,.outro .l:after{content:"";width:120px;height:5px;background:#d4a53a}
.outro p{font-size:44px;letter-spacing:4px;margin-top:60px;color:#fff}
</style></head><body>
<div id="bg"></div><div class="shade"></div>
<svg class="n" width="1080" height="1920"><filter id="f"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#f)"/></svg>
<div class="brand" id="brand">FORJADOS<small>PODCAST</small></div>
<div class="mid" id="mid"><div class="kicker" id="k"></div><div class="big" id="b"></div></div>
<div class="cap" id="cap"><p id="c"></p></div>
<div class="cred" id="cr"></div>
<div class="outro" id="o"><h1>FORJADOS</h1><div class="l">PODCAST</div><p id="op"></p></div>
<script>
window.setFrame=async(d)=>{
 if(d.img){await new Promise(r=>{const im=new Image();im.onload=im.onerror=r;im.src='file://'+d.img;});}
 document.getElementById('bg').style.backgroundImage=d.img?`url('file://${d.img}')`:'none';
 const k=document.getElementById('k');k.textContent=d.kicker||'';k.style.display=d.kicker?'inline-block':'none';
 const b=document.getElementById('b');b.textContent=d.big||'';const L=(d.big||'').length;
 b.style.fontSize=(L<=5?260:L<=9?190:L<=14?140:L<=22?110:90)+'px';
 document.getElementById('c').innerHTML=d.cap||'';
 document.getElementById('cr').textContent=d.credito||'';
 const o=d.outro;document.getElementById('o').style.display=o?'flex':'none';
 document.getElementById('op').textContent=o?(d.cap_outro||'Episódios completos no Spotify'):'';
 ['mid','cap','brand'].forEach(id=>document.getElementById(id).style.display=o?'none':'block');
};
</script></body></html>
